<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport tag ensures it scales correctly on your older Android screen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Crypto</title>
    <!-- Lightweight compression and encryption libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f9f9f9; }
        textarea, input { width: 100%; box-sizing: border-box; margin-bottom: 15px; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 12px 15px; font-size: 16px; cursor: pointer; margin-right: 5px; margin-bottom: 10px; border: none; border-radius: 4px; background: #007bff; color: white; }
        button:hover { background: #0056b3; }
        .actions { display: flex; flex-wrap: wrap; margin-bottom: 10px; }
        .copy-btn { background: #28a745; }
        .copy-btn:hover { background: #1e7e34; }
    </style>
</head>
<body>
    <h2>Tiny Crypto Tool</h2>
    <input type="password" id="pwd" placeholder="Encryption Password">
    <textarea id="inputBox" rows="6" placeholder="Paste plain text OR encrypted string here..."></textarea>
    
    <div class="actions">
        <button onclick="process('encrypt')">Compress & Encrypt</button>
        <button onclick="process('decrypt')">Decrypt & Decompress</button>
        <button onclick="copyOut()" class="copy-btn">Copy Output</button>
    </div>

    <textarea id="outputBox" rows="6" placeholder="Result will appear here..." readonly></textarea>

    <script>
        function process(action) {
            const input = document.getElementById('inputBox').value;
            const pwd = document.getElementById('pwd').value;
            const output = document.getElementById('outputBox');
            
            if (!pwd) { alert("Please enter a password"); return; }
            if (!input) { alert("Please enter some text"); return; }

            try {
                if (action === 'encrypt') {
                    // 1. Compress raw text to Base64 (clipboard safe)
                    const compressed = LZString.compressToBase64(input);
                    // 2. Encrypt the compressed data
                    output.value = CryptoJS.AES.encrypt(compressed, pwd).toString();
                } else {
                    // 1. Decrypt the AES string back to compressed Base64
                    const decryptedBytes = CryptoJS.AES.decrypt(input, pwd);
                    const compressed = decryptedBytes.toString(CryptoJS.enc.Utf8);
                    if (!compressed) throw new Error("Wrong password or corrupted string");
                    // 2. Decompress back to original text
                    output.value = LZString.decompressFromBase64(compressed);
                }
            } catch (e) {
                alert("Error: " + e.message);
                output.value = "";
            }
        }

        // Uses legacy execCommand for maximum compatibility with older Android webviews
        function copyOut() {
            const out = document.getElementById('outputBox');
            if(!out.value) return;
            out.select();
            out.setSelectionRange(0, 99999); // For mobile devices
            document.execCommand('copy');
            alert("Copied to clipboard!");
        }
    </script>
</body>
</html>
